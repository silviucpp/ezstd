language: erlang

matrix:

  include:
    - os: linux
      dist: focal
      otp_release: 27.0

    - os: linux
      dist: jammy
      otp_release: 26.1.1

    - os: linux
      dist: noble
      otp_release: 26.1.1

    # Windows has no Erlang language support on Travis, so the job is a shell job that
    # installs Erlang and Zig from Chocolatey. Zig is what build_win32.ps1 compiles the
    # NIF with; nothing else is needed.
    - os: windows
      language: shell
      before_install:
        - choco install -y --no-progress erlang zig
        - export PATH="$PATH:$(ls -d '/c/Program Files/Erlang OTP'* '/c/Program Files/erl'* 2>/dev/null | head -1)/bin"
        - erl -noshell -eval 'io:format("~s~n",[erlang:system_info(system_architecture)]),halt().'
        - zig version
      script:
        - ./rebar3 compile
        - ./rebar3 ct
      after_success: true

before_script:

- if [[ $TRAVIS_OS_NAME == linux ]]; then sudo apt-get -y update || true ; fi
- if [[ $TRAVIS_OS_NAME == linux ]]; then sudo apt-get install -y g++ make cmake || true ; fi

- curl https://s3.amazonaws.com/rebar3/rebar3 --output rebar3 && chmod +x rebar3

script:
    - ./rebar3 compile

after_success:
  - ./rebar3 ct
